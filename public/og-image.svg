<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: deep navy -->
  <rect width="1200" height="630" fill="#1D3557"/>
  <!-- Subtle grid overlay -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(250,250,247,0.025)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Logo (cream version) -->
  <image href="/logo.svg" x="64" y="60" width="180" height="56" style="filter:brightness(10) saturate(0)"/>
  <!-- Burnt orange accent hairline -->
  <rect x="64" y="136" width="80" height="2" fill="#C8552B"/>
  <!-- Main headline -->
  <text x="64" y="270" font-family="'Outfit Variable','Outfit','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#FAFAF7">GridSphere —</text>
  <text x="64" y="338" font-family="'Outfit Variable','Outfit','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#FAFAF7">Utility consulting and research,</text>
  <text x="64" y="398" font-family="'Outfit Variable','Outfit','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#B8C4DC">built on alignment.</text>
  <!-- Bottom mono label -->
  <text x="64" y="558" font-family="'Outfit Variable','Outfit','Courier New',monospace" font-size="14" font-weight="600" letter-spacing="3" fill="#8FA0BD">100% WOMEN-OWNED  ·  DETROIT, MI  ·  SAM.GOV REGISTERED</text>
  <!-- Bottom accent line -->
  <rect x="64" y="576" width="1072" height="1" fill="#2D4878"/>
</svg>
